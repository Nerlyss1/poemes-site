<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pour toi</title>

  <style>
    body {
      margin: 0;
      font-family: 'Georgia', serif;
      background: #0e0e11;
      color: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      max-width: 700px;
      padding: 25px;
      text-align: center;
    }

    h2 {
      font-weight: normal;
      margin-bottom: 20px;
    }

    p {
      white-space: pre-line;
      line-height: 1.7;
      font-size: 1.1rem;
    }

    button {
      margin: 20px 10px;
      padding: 12px 26px;
      background: transparent;
      border: 1px solid #fff;
      color: #fff;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<!-- Bloc mot de passe -->
<div class="container" id="lock">
  <h2>Un secret t’attend</h2>
  <input id="password" type="password" placeholder="Mot de passe"
         style="padding:12px;width:80%;max-width:260px;">
  <br><br>
  <button onclick="unlock()">Entrer</button>
  <p id="error" style="color:#ff8c8c; display:none;">Mauvais mot de passe...</p>
</div>

<!-- Bloc poème -->
<div class="container hidden" id="poemBox">
  <h2 id="title"></h2>
  <p id="text"></p>

  <button onclick="prev()">←</button>
  <button onclick="next()">→</button>
</div>

<script>
  const PASSWORD = "280925";  // mot de passe
  const TOTAL_POEMS = 23;      // nombre total de poèmes

  let index = 1;  // poème actuel

  // Tableau pour convertir en chiffres romains I, II, III...
  const roman = ['I','II','III','IV','V','VI','VII','VIII','IX','X',
                 'XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX',
                 'XXI','XXII','XXIII'];

  // Charger le poème
  async function loadPoem() {
    try {
      const res = await fetch(`poems/poem${String(index).padStart(2,'0')}.json`);
      const data = await res.json();

      // Titre automatique : Poème I, II…
      document.getElementById("title").innerText = `Poème ${roman[index-1]}`;

      // Texte du poème
      document.getElementById("text").innerText = data.text;
    } catch (err) {
      document.getElementById("text").innerText = "Erreur lors du chargement du poème.";
      console.error(err);
    }
  }

  // Déverrouiller le site
  function unlock() {
    const pass = document.getElementById("password").value;
    if (pass === PASSWORD) {
      document.getElementById("lock").classList.add("hidden");
      document.getElementById("poemBox").classList.remove("hidden");
      loadPoem();
    } else {
      document.getElementById("error").style.display = "block";
    }
  }

  // Poème suivant
  function next() {
    if (index < TOTAL_POEMS) {
      index++;
      loadPoem();
    }
  }

  // Poème précédent
  function prev() {
    if (index > 1) {
      index--;
      loadPoem();
    }
  }
</script>

</body>
</html>
