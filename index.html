<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dernière page</title>
<style>
body {
    margin: 0;
    font-family: 'Georgia', serif;
    background: #0e0e11;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    color: #fff;
}

#finalPage {
    position: relative;
    text-align: center;
    z-index: 10;
}

#message {
    font-size: 2rem;
    z-index: 10;
    position: relative;
}

/* Grand cœur animé */
.corazonBg {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 200px;
    height: 200px;
    background: #ee6661;
    transform: translate(-50%, -50%) rotate(45deg);
    transform-origin: center;
    z-index: 1;
    animation: big 5s linear infinite;
}
.corazonBg::before,
.corazonBg::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background: #ee6661;
    border-radius: 50%;
    z-index: -1;
    animation: big1 5s linear infinite;
}
.corazonBg::before { top: -50%; left: 0; }
.corazonBg::after { bottom: 0; right: 50%; }

/* Animations cœur */
@keyframes big {
    0%{ transform: translate(-50%, -50%) rotate(45deg) scale(0.8);}
    33%{ transform: translate(-50%, -50%) rotate(45deg) scale(1.2);}
    66%{ transform: translate(-50%, -50%) rotate(45deg) scale(0.9);}
    100%{ transform: translate(-50%, -50%) rotate(45deg) scale(1);}
}
@keyframes big1 {
    0%{ background:#ee6661;}
    33%{ background:#db463a;}
    66%{ background:#af2f26;}
    100%{ background:#ee6661;}
}

/* Petit visage sur le cœur */
.face{
    width: 50px;
    height: 50px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index:2;
}
.eyeL, .eyeR, .mouth {
    width: 15px;
    height: 15px;
    background: #474747;
    border-radius: 50%;
    position: absolute;
    animation: faceanima 1.5s infinite;
}
.eyeL { left: -20px; top: -10px; }
.eyeR { left: 20px; top: -10px; }
.mouth { left: 0; top: 10px; width: 20px; height: 10px; border-radius: 10px/5px; background: #474747; }

@keyframes faceanima {
    0%,25%,90%,100%{ transform: scale(1);}
    30%,75%{ transform: scale(1.3);}
}

/* Animation machine à écrire pour le texte */
#message span {
    display: inline-block;
    opacity: 0;
}
</style>
</head>
<body>
<div class="corazonBg"></div>

<div id="finalPage">
    <div class="face">
        <div class="eyeL"></div>
        <div class="eyeR"></div>
        <div class="mouth"></div>
    </div>
    <div id="message"></div>
</div>

<audio id="typeSound" src="pop.mp3"></audio>

<script>
// Texte à afficher
const messageText = "J’espère que ça t’a plu, je t’aime ❤️";
const messageDiv = document.getElementById('message');
const typeSound = document.getElementById('typeSound');

let i = 0;
function typeWriter() {
    if(i < messageText.length) {
        const span = document.createElement('span');
        span.textContent = messageText[i];
        messageDiv.appendChild(span);
        setTimeout(() => { span.style.opacity = 1; }, 50);
        typeSound.currentTime = 0;
        typeSound.play();
        i++;
        setTimeout(typeWriter, 100); // vitesse d'apparition
    }
}
typeWriter();
</script>
</body>
</html>
