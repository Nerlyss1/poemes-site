<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pour toi</title>
  <style>
    body {
      margin: 0;
      font-family: 'Georgia', serif;
      background: #0e0e11;
      color: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .container {
      max-width: 700px;
      padding: 25px;
      text-align: center;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    h2 {
      font-weight: normal;
      margin-bottom: 20px;
    }
    p {
      white-space: pre-line;
      line-height: 1.7;
      font-size: 1.1rem;
    }
    button {
      margin: 20px 10px;
      padding: 12px 26px;
      background: transparent;
      border: 1px solid #fff;
      color: #fff;
      cursor: pointer;
      animation: pulse 1.5s infinite;
    }
    .hidden { display: none; }
    .show { opacity: 1; transform: scale(1); }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    #gift {
      cursor: pointer;
      font-size: 1.3rem;
      border: 1px dashed #fff;
      padding: 20px;
      border-radius: 12px;
    }
    canvas { position: fixed; top:0; left:0; pointer-events:none; z-index:10; }
  </style>
</head>
<body>

<!-- Mot de passe -->
<div class="container" id="lock">
  <h2>Un secret t’attend</h2>
  <input id="password" type="password" placeholder="Mot de passe" style="padding:12px;width:80%;max-width:260px;">
  <br><br>
  <button onclick="unlock()">Entrer</button>
  <p id="error" style="color:#ff8c8c; display:none;">Mauvais mot de passe...</p>
</div>

<!-- Cadeau -->
<div class="container hidden" id="giftBox">
  <div id="gift" class="show" onclick="openGift()">
    🎁 Clique ici pour ton cadeau 🎁
  </div>
</div>

<!-- Poème -->
<div class="container hidden" id="poemBox">
  <h2 id="title"></h2>
  <p id="text"></p>
  <div id="spotify"></div>
  <button onclick="prev()">←</button>
  <button onclick="next()">→</button>
</div>

<!-- Son -->
<audio id="giftSound" src="https://freesound.org/data/previews/341/341695_3248244-lq.mp3"></audio>

<script>
const PASSWORD = "280925";
const TOTAL_POEMS = 23;
let index = 1;

// Chiffres romains pour les titres
const roman = ['I','II','III','IV','V','VI','VII','VIII','IX','X',
               'XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX',
               'XXI','XXII','XXIII'];

// Spotify src par poème (à compléter)
const spotifyLinks = [
  "https://open.spotify.com/embed/track/35KiiILklye1JRRctaLUb4",
  "https://open.spotify.com/embed/track/3tJjZMHLqhD8DaGgdBICnc",
  "https://open.spotify.com/embed/track/5tuhOP6bY3NlwTHghY5MbN",
  "https://open.spotify.com/embed/track/1BncfTJAWxrsxyT9culBrj",
  "https://open.spotify.com/embed/track/6kkwzB6hXLIONkEk9JciA6",
  "https://open.spotify.com/embed/track/0eBryM7ePQH3Klt3jz8xZd",
  "https://open.spotify.com/embed/track/1HMQmOWrkieKYWlFsjUP3D",
  "https://open.spotify.com/embed/track/1m8WpLYXEiNVZchsWEcCSy",
  "https://open.spotify.com/embed/track/4X6aeSW2bhlbm7YyEstj6Y",
  "https://open.spotify.com/embed/track/0hNduWmlWmEmuwEFcYvRu1",
  "https://open.spotify.com/embed/track/22TntnVO3lQNDR5nsvxGRs",
  "https://open.spotify.com/embed/track/2qPSa6HXjzwa9sLhNGpA1T",
  "https://open.spotify.com/embed/track/2kfGoV9a5dbSKCNmUWH2ZF",
  "https://open.spotify.com/embed/track/1s9i7W8zx7Nxx78MUIsvjV",
  "https://open.spotify.com/embed/track/6BqrPvrPOwpYkdLCgSqtVB",
  "https://open.spotify.com/embed/track/2XpokHuPmtcgvqicXaxFL2",
  "https://open.spotify.com/embed/track/5EjtHY6GPESVSqDrqBWWXY",
  "https://open.spotify.com/embed/track/2IqjKEBiz0CdLKdkXhxw84",
  "https://open.spotify.com/embed/track/5zT5cMnMKoyruPj13TQXGx",
  "https://open.spotify.com/embed/track/1BncfTJAWxrsxyT9culBrj",
  "https://open.spotify.com/embed/track/0rTV5WefWd1J3OwIheTzxM",
  "https://open.spotify.com/embed/track/1GKrArph1YXfxMH49flYND",
  "https://open.spotify.com/embed/track/33kKcOJoyNduHwXhEnga8X"
];

async function loadPoem() {
  try {
    const res = await fetch(`poems/poem${String(index).padStart(2,'0')}.json`);
    const data = await res.json();

    document.getElementById("title").innerText = `Poème ${roman[index-1]}`;
    document.getElementById("text").innerText = data.text;

    // Spotify
    document.getElementById("spotify").innerHTML = `<iframe style="border-radius:12px" src="${spotifyLinks[index-1]}" width="100%" height="352" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>`;
  } catch(e){
    console.error(e);
    document.getElementById("text").innerText = "Erreur lors du chargement du poème.";
  }
}

// Déverrouiller mot de passe
function unlock() {
  const pass = document.getElementById("password").value;
  if(pass === PASSWORD){
    document.getElementById("lock").classList.add("hidden");
    document.getElementById("giftBox").classList.remove("hidden");
    setTimeout(()=>document.getElementById("giftBox").classList.add("show"),50);
  } else {
    document.getElementById("error").style.display="block";
  }
}

// Ouvrir le cadeau
function openGift() {
  document.getElementById("giftSound").play();
  createConfetti();
  const gift = document.getElementById("giftBox");
  const poemBox = document.getElementById("poemBox");

  // Laisser le cadeau visible 1,5s avant de disparaître
  setTimeout(()=>{
    gift.classList.add("hidden");
    poemBox.classList.remove("hidden");
    setTimeout(()=>poemBox.classList.add("show"),50);
    loadPoem();
  },1500);
}

// Confettis
function createConfetti() {
  const canvas = document.createElement("canvas");
  canvas.id = "confettiCanvas";
  document.body.appendChild(canvas);
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const confetti = [];
  for(let i=0;i<150;i++){
    confetti.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, r:Math.random()*6+2, d:Math.random()*50+10, color:`hsl(${Math.random()*360},100%,70%)`, tilt:Math.random()*10-10});
  }

  let angle=0, frame=0;
  const interval = setInterval(()=>{
    ctx.clearRect(0,0,canvas.width,canvas.height);
    confetti.forEach(c=>{
      ctx.beginPath();
      ctx.lineWidth=c.r;
      ctx.strokeStyle=c.color;
      ctx.moveTo(c.x+c.tilt+c.r/2, c.y);
      ctx.lineTo(c.x+c.tilt, c.y+c.tilt+c.r/2);
      ctx.stroke();
    });
    angle+=0.01;
    confetti.forEach(c=>{c.y+=(Math.cos(angle+c.d)+1+c.r/2)/2; c.x+=Math.sin(angle); if(c.y>canvas.height)c.y=0;});
    frame++;
    if(frame>120){ // confettis disparaissent après ~4s
      clearInterval(interval);
      canvas.remove();
    }
  },30);
}

// Navigation poèmes
function next(){ if(index<TOTAL_POEMS){ index++; loadPoem(); } }
function prev(){ if(index>1){ index--; loadPoem(); } }

</script>
</body>
</html>
