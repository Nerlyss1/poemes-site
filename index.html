<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pour toi</title>
  <style>
    body {
      margin: 0;
      font-family: 'Georgia', serif;
      background: #0e0e11;
      color: #f2f2f2;
      display: grid;
      place-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .container {
      width: min(700px, calc(100vw - 32px));
      max-width: 100%;
      padding: 25px;
      margin: 0 auto; /* center and keep small horizontal gap */
      text-align: center;
      box-sizing: border-box;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    h2 { font-weight: normal; margin-bottom: 20px; }
    p { white-space: pre-line; line-height: 1.7; font-size: 1.1rem; }
    button {
      margin: 20px 10px;
      padding: 12px 26px;
      background: transparent;
      border: 1px solid #fff;
      color: #fff;
      cursor: pointer;
      transition: transform 0.5s ease;
    }
    button.pulse { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1);}50%{transform:scale(1.1);} }
    .hidden { display: none; opacity: 0; transform: scale(0.95); }
    .show { opacity: 1; transform: scale(1); }
    .spotify-iframe { border-radius:12px; width:100%; height:80px; margin-top:8px; }
    #confettiCanvas { position: fixed; top:0; left:0; pointer-events: none; width:100%; height:100%; z-index:9999; }
    /* Final page typing style */
    #finalPage { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh; padding-top:8px; padding-bottom:8px; }
    .typing { color: #fff; white-space: pre-wrap; text-align:center; font-size:1.2rem; line-height:1.6; position:relative; display:inline-block; max-width:100%; box-sizing:border-box; margin:0; }
    /* blinking caret */
    .typing::after {
      content: '';
      display: inline-block;
      width: 2px;
      height: 1.2em;
      background: #fff;
      margin-left: 8px;
      vertical-align: bottom;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>

<!-- Bloc mot de passe -->
<div class="container" id="lock">
  <h2>Un secret t’attend</h2>
  <input id="password" type="password" placeholder="Mot de passe" style="padding:12px;width:80%;max-width:260px;"><br><br>
  <button onclick="unlock()" class="pulse">Entrer</button>
  <p id="error" style="color:#ff8c8c; display:none;">Mauvais mot de passe...</p>
</div>

<!-- Bloc cadeau -->
<div class="container hidden" id="gift">
  <h2>Un petit cadeau pour ton anniversaire 🎁</h2>
  <button onclick="openGift()" class="pulse">Ouvrir le cadeau</button>
</div>

<!-- Bloc poème -->
<div class="container hidden" id="poemBox">
  <h2 id="title"></h2>
  <p id="text"></p>
  <div id="music"></div>
  <button onclick="prev()">←</button>
  <button onclick="next()">→</button>
</div>

<!-- Page finale -->
<div class="container hidden" id="finalPage">
  <h2 class="typing" id="finalText"></h2>
</div>

<canvas id="confettiCanvas"></canvas>

<!-- Sons -->
<audio id="giftSound" src="https://www.soundjay.com/button/sounds/button-16.mp3"></audio>
<audio id="giftMusic" src="https://www.soundjay.com/button/sounds/button-3.mp3" loop></audio>
<!-- Typewriter sound (played per character, requires prior user gesture to allow audio autoplay in some browsers) -->
<audio id="typeSound" src="https://www.soundjay.com/button/sounds/button-16.mp3"></audio>

<script>
const PASSWORD = "280925";
const TOTAL_POEMS = 23;
let index = 1;
let finalShown = false;
let typingInterval = null;

const roman = ['I','II','III','IV','V','VI','VII','VIII','IX','X',
               'XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX',
               'XXI','XXII','XXIII'];

const spotifyLinks = [
  "https://open.spotify.com/embed/track/35KiiILklye1JRRctaLUb4",
  "https://open.spotify.com/embed/track/3tJjZMHLqhD8DaGgdBICnc",
  "https://open.spotify.com/embed/track/5tuhOP6bY3NlwTHghY5MbN",
  "https://open.spotify.com/embed/track/1BncfTJAWxrsxyT9culBrj",
  "https://open.spotify.com/embed/track/6kkwzB6hXLIONkEk9JciA6",
  "https://open.spotify.com/embed/track/0eBryM7ePQH3Klt3jz8xZd",
  "https://open.spotify.com/embed/track/1HMQmOWrkieKYWlFsjUP3D",
  "https://open.spotify.com/embed/track/1m8WpLYXEiNVZchsWEcCSy",
  "https://open.spotify.com/embed/track/4X6aeSW2bhlbm7YyEstj6Y",
  "https://open.spotify.com/embed/track/0hNduWmlWmEmuwEFcYvRu1",
  "https://open.spotify.com/embed/track/22TntnVO3lQNDR5nsvxGRs",
  "https://open.spotify.com/embed/track/2qPSa6HXjzwa9sLhNGpA1T",
  "https://open.spotify.com/embed/track/2kfGoV9a5dbSKCNmUWH2ZF",
  "https://open.spotify.com/embed/track/1s9i7W8zx7Nxx78MUIsvjV",
  "https://open.spotify.com/embed/track/6BqrPvrPOwpYkdLCgSqtVB",
  "https://open.spotify.com/embed/track/2XpokHuPmtcgvqicXaxFL2",
  "https://open.spotify.com/embed/track/5EjtHY6GPESVSqDrqBWWXY",
  "https://open.spotify.com/embed/track/2IqjKEBiz0CdLKdkXhxw84",
  "https://open.spotify.com/embed/track/5zT5cMnMKoyruPj13TQXGx",
  "https://open.spotify.com/embed/track/1BncfTJAWxrsxyT9culBrj",
  "https://open.spotify.com/embed/track/0rTV5WefWd1J3OwIheTzxM",
  "https://open.spotify.com/embed/track/1GKrArph1YXfxMH49flYND",
  "https://open.spotify.com/embed/track/33kKcOJoyNduHwXhEnga8X"
];

async function loadPoem() {
  try {
    const res = await fetch(`poems/poem${String(index).padStart(2,'0')}.json`);
    const data = await res.json();
    document.getElementById("title").innerText = `Poème ${roman[index-1]}`;
    document.getElementById("text").innerText = data.text;
    document.getElementById("music").innerHTML = `<iframe class="spotify-iframe" src="${spotifyLinks[index-1]}" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>`;
  } catch(err){
    document.getElementById("text").innerText = "Erreur lors du chargement du poème.";
    console.error(err);
  }
}

function unlock() {
  const pass = document.getElementById("password").value;
  if(pass === PASSWORD){
    document.getElementById("lock").classList.add("hidden");
    const gift = document.getElementById("gift");
    gift.classList.remove("hidden");
    setTimeout(()=>gift.classList.add("show"),50);
  } else { document.getElementById("error").style.display = "block"; }
}

function openGift() {
  const giftSound = document.getElementById("giftSound");
  const giftMusic = document.getElementById("giftMusic");
  giftSound.play();
  giftMusic.play();
  createConfetti();
  const gift = document.getElementById("gift");
  const poemBox = document.getElementById("poemBox");
  gift.classList.remove("show");
  setTimeout(()=>{
    gift.classList.add("hidden");
    poemBox.classList.remove("hidden");
    setTimeout(()=>poemBox.classList.add("show"),50);
    loadPoem();
  },2000); // confettis et musique pendant 2s
}

// Navigation poèmes
function next(){
  if(finalShown) return;
  if(index<TOTAL_POEMS){ index++; loadPoem(); }
  else {
    finalShown = true;
    // hide poem box and show final page with typing
    const poemBox = document.getElementById('poemBox');
    poemBox.classList.remove('show');
    setTimeout(()=>{
      poemBox.classList.add('hidden');
      const finalPage = document.getElementById('finalPage');
      finalPage.classList.remove('hidden');
      setTimeout(()=>{
        finalPage.classList.add('show');
        typeText("Comme Emily Dickinson l’aurait écrit :\n« Le bonheur est parfois un petit souffle de poésie »");
      },50);
    },300);
  }
}

function prev(){ if(index>1){ index--; loadPoem(); } }

// Confetti
function createConfetti() {
  const canvas = document.getElementById("confettiCanvas");
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const confetti = [];
  for(let i=0;i<150;i++){
    confetti.push({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height,
      r: Math.random()*6+2,
      d: Math.random()*50+10,
      color: `hsl(${Math.random()*360},100%,70%)`,
      tilt: Math.random()*10-10
    });
  }

  let angle=0;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    confetti.forEach(c=>{
      ctx.beginPath();
      ctx.lineWidth=c.r;
      ctx.strokeStyle=c.color;
      ctx.moveTo(c.x+c.tilt+c.r/2, c.y);
      ctx.lineTo(c.x+c.tilt, c.y+c.tilt+c.r/2);
      ctx.stroke();
    });
    update();
  }
  function update(){
    angle+=0.01;
    confetti.forEach(c=>{
      c.y += (Math.cos(angle+c.d)+1+c.r/2)/2;
      c.x += Math.sin(angle);
      if(c.y>canvas.height) c.y=0;
    });
  }
  const interval = setInterval(draw,30);
  setTimeout(()=>{
    clearInterval(interval);
    ctx.clearRect(0,0,canvas.width,canvas.height);
  },2000);
}
</script>

<script>
// Typewriter for final page
function typeText(text){
  const el = document.getElementById('finalText');
  if(!el) return;
  let i = 0;
  el.textContent = '';
  if(typingInterval){ clearInterval(typingInterval); typingInterval = null; }
  const typeSound = document.getElementById('typeSound');
  function typeChar(){
    if(i < text.length){
      el.textContent += text[i];
      if(typeSound){ try{ typeSound.currentTime = 0; typeSound.play(); }catch(e){} }
      i++;
      const delay = 40 + Math.random()*60; // 40-100ms random-ish
      typingInterval = setTimeout(typeChar, delay);
    } else {
      typingInterval = null;
    }
  }
  typeChar();
}
</script>

</body>
</html>
