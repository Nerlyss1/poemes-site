<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  /* Basic reset + box sizing */
  :root { box-sizing: border-box; }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { width:100%; height:100%; margin:0; padding:0; }

  /* Page background and centering */
  body {
    margin: 0;
    font-family: Georgia, serif;
    background: #0e0e11;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Main container: responsive, centered by default */
  .container {
    width: clamp(280px, 90%, 700px);
    max-width: 700px;
    padding: clamp(16px, 4vw, 28px);
    margin: 0 auto;
    text-align: center;
    transition: opacity 0.5s ease, transform 0.5s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  h2 { font-weight: 400; margin: 0 0 10px 0; }
  p { white-space: pre-line; line-height: 1.7; font-size: 1.05rem; margin:0; }

  /* Controls */
  button {
    display: inline-block;
    margin: 12px auto;
    padding: 10px 20px;
    background: transparent;
    border: 1px solid #fff;
    color: #fff;
    cursor: pointer;
    transition: transform 0.2s ease;
  }
  button.pulse { animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.05);} }

  .hidden { display: none; opacity: 0; transform: scale(0.98); }
  .show { opacity: 1; transform: scale(1); }

  /* Responsive iframe for music */
  .spotify-iframe { width:100%; height:80px; border-radius:12px; margin-top:12px; }

  /* Confetti canvas covers viewport */
  #confettiCanvas { position: fixed; inset: 0; pointer-events:none; width:100%; height:100%; z-index:9999; }

  /* Final page centered */
  #finalPage { display:flex; flex-direction:column; align-items:center; justify-content:center; }

  /* Typing text */
  .typing { display:block; white-space: pre-line; text-align:center; line-height:1.6; font-size:1.15rem; }

  /* Small screens tweaks */
  @media (max-width: 480px){
    .typing { font-size: 1rem; }
    .spotify-iframe { height:64px; }
    .container { padding: 16px; }
  }
</style>
</style>
</head>
<body>

<!-- Bloc mot de passe -->
<div class="container" id="lock">
  <h2>Un secret t’attend</h2>
  <input id="password" type="password" placeholder="Mot de passe" style="padding:12px;width:80%;max-width:260px;"><br><br>
  <button onclick="unlock()" class="pulse">Entrer</button>
  <p id="error" style="color:#ff8c8c; display:none;">Mauvais mot de passe...</p>
</div>

<!-- Bloc cadeau -->
<div class="container hidden" id="gift">
  <h2>Un petit cadeau pour ton anniversaire 🎁</h2>
  <button onclick="openGift()" class="pulse">Ouvrir le cadeau</button>
</div>

<!-- Bloc poème -->
<div class="container hidden" id="poemBox">
  <h2 id="title"></h2>
  <p id="text"></p>
  <div id="music"></div>
  <button onclick="prev()">←</button>
  <button onclick="next()">→</button>
</div>

<!-- Page finale -->
<div class="container hidden" id="finalPage">
  <h2 class="typing" id="finalText"></h2>
</div>

<canvas id="confettiCanvas"></canvas>

<audio id="giftSound" src="gift_pop.mp3"></audio>
<audio id="changeSound" src="change_poem.mp3"></audio>

<script>
const PASSWORD="280925";
const TOTAL_POEMS=23;
let index=1;

const roman=['I','II','III','IV','V','VI','VII','VIII','IX','X',
             'XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX',
             'XXI','XXII','XXIII'];

const spotifyLinks=[
"https://open.spotify.com/embed/track/35KiiILklye1JRRctaLUb4",
"https://open.spotify.com/embed/track/3tJjZMHLqhD8DaGgdBICnc",
"https://open.spotify.com/embed/track/5tuhOP6bY3NlwTHghY5MbN",
"https://open.spotify.com/embed/track/1BncfTJAWxrsxyT9culBrj",
"https://open.spotify.com/embed/track/6kkwzB6hXLIONkEk9JciA6",
"https://open.spotify.com/embed/track/0eBryM7ePQH3Klt3jz8xZd",
"https://open.spotify.com/embed/track/1HMQmOWrkieKYWlFsjUP3D",
"https://open.spotify.com/embed/track/1m8WpLYXEiNVZchsWEcCSy",
"https://open.spotify.com/embed/track/4X6aeSW2bhlbm7YyEstj6Y",
"https://open.spotify.com/embed/track/0hNduWmlWmEmuwEFcYvRu1",
"https://open.spotify.com/embed/track/22TntnVO3lQNDR5nsvxGRs",
"https://open.spotify.com/embed/track/2qPSa6HXjzwa9sLhNGpA1T",
"https://open.spotify.com/embed/track/2kfGoV9a5dbSKCNmUWH2ZF",
"https://open.spotify.com/embed/track/1s9i7W8zx7Nxx78MUIsvjV",
"https://open.spotify.com/embed/track/6BqrPvrPOwpYkdLCgSqtVB",
"https://open.spotify.com/embed/track/2XpokHuPmtcgvqicXaxFL2",
"https://open.spotify.com/embed/track/5EjtHY6GPESVSqDrqBWWXY",
"https://open.spotify.com/embed/track/2IqjKEBiz0CdLKdkXhxw84",
"https://open.spotify.com/embed/track/5zT5cMnMKoyruPj13TQXGx",
"https://open.spotify.com/embed/track/1BncfTJAWxrsxyT9culBrj",
"https://open.spotify.com/embed/track/0rTV5WefWd1J3OwIheTzxM",
"https://open.spotify.com/embed/track/1GKrArph1YXfxMH49flYND",
"https://open.spotify.com/embed/track/33kKcOJoyNduHwXhEnga8X"
];

let finalShown = false;
let typingInterval = null;

async function loadPoem(){
  try{
    const res=await fetch(`poems/poem${String(index).padStart(2,'0')}.json`);
    const data=await res.json();
    document.getElementById("title").innerText=`Poème ${roman[index-1]}`;
    document.getElementById("text").innerText=data.text;
    document.getElementById("music").innerHTML=`<iframe class="spotify-iframe" src="${spotifyLinks[index-1]}" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>`;
  }catch(err){
    document.getElementById("text").innerText="Erreur lors du chargement du poème.";
    console.error(err);
  }
}

function unlock(){
  const pass=document.getElementById("password").value;
  if(pass===PASSWORD){
    document.getElementById("lock").classList.add("hidden");
    const gift=document.getElementById("gift");
    gift.classList.remove("hidden");
    setTimeout(()=>gift.classList.add("show"),50);
  }else{
    document.getElementById("error").style.display="block";
  }
}

function openGift(){
  document.getElementById("giftSound").play();
  createConfetti();
  const gift=document.getElementById("gift");
  const poemBox=document.getElementById("poemBox");
  gift.classList.remove("show");
  setTimeout(()=>{
    gift.classList.add("hidden");
    poemBox.classList.remove("hidden");
    setTimeout(()=>poemBox.classList.add("show"),50);
    loadPoem();
  },2000);
}

function next(){
  if(finalShown) return;
  if(index<TOTAL_POEMS){ 
    index++; 
    document.getElementById("changeSound").play();
    loadPoem(); 
  }else{
    finalShown = true;
    document.getElementById("poemBox").classList.remove("show");
    setTimeout(()=>{
      document.getElementById("poemBox").classList.add("hidden");
      const finalPage=document.getElementById("finalPage");
      finalPage.classList.remove("hidden");
      setTimeout(()=>{
        finalPage.classList.add("show");
        typeText("Comme Emily Dickinson l’aurait écrit :\n« Le bonheur est parfois un petit souffle de poésie. »");
      },50);
    },500);
  }
}

function prev(){
  if(index>1){ index--; document.getElementById("changeSound").play(); loadPoem(); }
}

// Flèches clavier
document.addEventListener('keydown', e=>{
  if(finalShown) return;
  if(e.key==='ArrowRight'){ next(); }
  if(e.key==='ArrowLeft'){ prev(); }
});

// Confettis
function createConfetti(){
  const canvas=document.getElementById("confettiCanvas");
  const ctx=canvas.getContext("2d");
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  const confetti=[];
  for(let i=0;i<150;i++){
    confetti.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height,
      r:Math.random()*6+2,
      d:Math.random()*50+10,
      color:`hsl(${Math.random()*360},100%,70%)`,
      tilt:Math.random()*10-10
    });
  }
  let angle=0;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    confetti.forEach(c=>{
      ctx.beginPath();
      ctx.lineWidth=c.r;
      ctx.strokeStyle=c.color;
      ctx.moveTo(c.x+c.tilt+c.r/2, c.y);
      ctx.lineTo(c.x+c.tilt, c.y+c.tilt+c.r/2);
      ctx.stroke();
    });
    update();
  }
  function update(){
    angle+=0.01;
    confetti.forEach(c=>{
      c.y+=(Math.cos(angle+c.d)+1+c.r/2)/2;
      c.x+=Math.sin(angle);
      if(c.y>canvas.height) c.y=0;
    });
  }
  const interval=setInterval(draw,30);
  setTimeout(()=>{clearInterval(interval); canvas.remove();},2000);
}

// Texte machine à écrire
function typeText(text){
  const el=document.getElementById("finalText");
  let i=0;
  el.textContent = "";
  if(typingInterval){ clearInterval(typingInterval); typingInterval = null; }
  typingInterval = setInterval(()=>{
    if(i < text.length){
      el.textContent += text[i];
      i++;
    } else {
      clearInterval(typingInterval);
      typingInterval = null;
    }
  },80);
}
</script>
</body>
</html>
