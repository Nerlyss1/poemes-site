<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pour toi</title>
  <style>
    body {
      margin: 0;
      font-family: 'Georgia', serif;
      background: #0e0e11;
      color: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .container {
      max-width: 700px;
      padding: 25px;
      text-align: center;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    h2 {
      font-weight: normal;
      margin-bottom: 20px;
    }
    p {
      white-space: pre-line;
      line-height: 1.7;
      font-size: 1.1rem;
    }
    button {
      margin: 20px 10px;
      padding: 12px 26px;
      background: transparent;
      border: 1px solid #fff;
      color: #fff;
      cursor: pointer;
      transition: transform 0.5s ease;
    }
    button.pulse {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    .hidden { display: none; opacity: 0; transform: scale(0.95); }
    .show { opacity: 1; transform: scale(1); }
    .spotify-iframe { border-radius:12px; width:100%; height:80px; margin-top:15px; }
    #confettiCanvas {
      position: fixed;
      top:0;
      left:0;
      pointer-events: none;
      width:100%;
      height:100%;
      z-index:9999;
    }
    /* Dernière page */
    #finalPage {
      position: relative;
      text-align: center;
      color: #ff6b81;
    }
    #finalText {
      font-size: 1.5rem;
      font-family: 'Georgia', serif;
      min-height: 3em;
    }
    #heart {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100px;
      height: 90px;
      transform: translate(-50%, -50%) scale(0);
      background: red;
      clip-path: polygon(50% 0%, 61% 12%, 75% 12%, 88% 25%, 88% 38%, 75% 50%, 50% 75%, 25% 50%, 12% 38%, 12% 25%, 25% 12%, 39% 12%);
      animation: heartPulse 1s ease-in-out forwards;
    }
    @keyframes heartPulse {
      0% { transform: translate(-50%, -50%) scale(0); }
      50% { transform: translate(-50%, -50%) scale(1.2); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }
  </style>
</head>
<body>

<!-- Bloc mot de passe -->
<div class="container" id="lock">
  <h2>Un secret t’attend</h2>
  <input id="password" type="password" placeholder="Mot de passe" style="padding:12px;width:80%;max-width:260px;"><br><br>
  <button onclick="unlock()" class="pulse">Entrer</button>
  <p id="error" style="color:#ff8c8c; display:none;">Mauvais mot de passe...</p>
</div>

<!-- Bloc cadeau -->
<div class="container hidden" id="gift">
  <h2>Un petit cadeau pour ton anniversaire 🎁</h2>
  <button onclick="openGift()" class="pulse">Ouvrir le cadeau</button>
</div>

<!-- Bloc poème -->
<div class="container hidden" id="poemBox">
  <h2 id="title"></h2>
  <p id="text"></p>
  <div id="music"></div>
  <button onclick="prev()">←</button>
  <button onclick="next()">→</button>
</div>

<!-- Dernière page -->
<div id="finalPage" class="container hidden">
  <div id="heart"></div>
  <h2 id="finalText"></h2>
</div>

<canvas id="confettiCanvas"></canvas>

<audio id="bgMusic" src="ton_son_fond.mp3" loop></audio>
<audio id="giftSound" src="son_cadeau.mp3"></audio>
<audio id="poemSound" src="son_changement.mp3"></audio>

<script>
  const PASSWORD = "280925";
  const TOTAL_POEMS = 23;
  let index = 1;

  const roman = ['I','II','III','IV','V','VI','VII','VIII','IX','X',
                 'XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX',
                 'XXI','XXII','XXIII'];

  const spotifyLinks = [
    "https://open.spotify.com/embed/track/35KiiILklye1JRRctaLUb4",
    "https://open.spotify.com/embed/track/3tJjZMHLqhD8DaGgdBICnc",
    "https://open.spotify.com/embed/track/5tuhOP6bY3NlwTHghY5MbN",
    "https://open.spotify.com/embed/track/1BncfTJAWxrsxyT9culBrj",
    "https://open.spotify.com/embed/track/6kkwzB6hXLIONkEk9JciA6",
    "https://open.spotify.com/embed/track/0eBryM7ePQH3Klt3jz8xZd",
    "https://open.spotify.com/embed/track/1HMQmOWrkieKYWlFsjUP3D",
    "https://open.spotify.com/embed/track/1m8WpLYXEiNVZchsWEcCSy",
    "https://open.spotify.com/embed/track/4X6aeSW2bhlbm7YyEstj6Y",
    "https://open.spotify.com/embed/track/0hNduWmlWmEmuwEFcYvRu1",
    "https://open.spotify.com/embed/track/22TntnVO3lQNDR5nsvxGRs",
    "https://open.spotify.com/embed/track/2qPSa6HXjzwa9sLhNGpA1T",
    "https://open.spotify.com/embed/track/2kfGoV9a5dbSKCNmUWH2ZF",
    "https://open.spotify.com/embed/track/1s9i7W8zx7Nxx78MUIsvjV",
    "https://open.spotify.com/embed/track/6BqrPvrPOwpYkdLCgSqtVB",
    "https://open.spotify.com/embed/track/2XpokHuPmtcgvqicXaxFL2",
    "https://open.spotify.com/embed/track/5EjtHY6GPESVSqDrqBWWXY",
    "https://open.spotify.com/embed/track/2IqjKEBiz0CdLKdkXhxw84",
    "https://open.spotify.com/embed/track/5zT5cMnMKoyruPj13TQXGx",
    "https://open.spotify.com/embed/track/1BncfTJAWxrsxyT9culBrj",
    "https://open.spotify.com/embed/track/0rTV5WefWd1J3OwIheTzxM",
    "https://open.spotify.com/embed/track/1GKrArph1YXfxMH49flYND",
    "https://open.spotify.com/embed/track/33kKcOJoyNduHwXhEnga8X"
  ];

  async function loadPoem() {
    try {
      const res = await fetch(`poems/poem${String(index).padStart(2,'0')}.json`);
      const data = await res.json();
      document.getElementById("title").innerText = `Poème ${roman[index-1]}`;
      document.getElementById("text").innerText = data.text;
      document.getElementById("music").innerHTML = `<iframe class="spotify-iframe" src="${spotifyLinks[index-1]}" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>`;
      document.getElementById("poemSound").play();
    } catch(err){
      document.getElementById("text").innerText = "Erreur lors du chargement du poème.";
      console.error(err);
    }
  }

  function unlock() {
    const pass = document.getElementById("password").value;
    if(pass === PASSWORD){
      document.getElementById("lock").classList.add("hidden");
      const gift = document.getElementById("gift");
      gift.classList.remove("hidden");
      setTimeout(()=>gift.classList.add("show"),50);
      document.getElementById("bgMusic").play();
    } else {
      document.getElementById("error").style.display = "block";
    }
  }

  function openGift() {
    document.getElementById("giftSound").play();
    createConfetti();
    const gift = document.getElementById("gift");
    const poemBox = document.getElementById("poemBox");
    gift.classList.remove("show");
    setTimeout(()=>{
      gift.classList.add("hidden");
      poemBox.classList.remove("hidden");
      setTimeout(()=>poemBox.classList.add("show"),50);
      loadPoem();
    },2000); // confettis + son pendant 2s
  }

  function next() {
    if(index < TOTAL_POEMS){ 
      index++; 
      if(index > TOTAL_POEMS) showFinalPage();
      else loadPoem(); 
    } else showFinalPage();
  }

  function prev() {
    if(index > 1){ index--; loadPoem(); }
  }

  function createConfetti() {
    const canvas = document.getElementById("confettiCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const confetti = [];
    for(let i=0;i<150;i++){
      confetti.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        r: Math.random()*6+2,
        d: Math.random()*50+10,
        color: `hsl(${Math.random()*360},100%,70%)`,
        tilt: Math.random()*10-10
      });
    }

    let angle=0;
    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      confetti.forEach(c=>{
        ctx.beginPath();
        ctx.lineWidth=c.r;
        ctx.strokeStyle=c.color;
        ctx.moveTo(c.x+c.tilt+c.r/2, c.y);
        ctx.lineTo(c.x+c.tilt, c.y+c.tilt+c.r/2);
        ctx.stroke();
      });
      confetti.forEach(c=>{
        c.y += (Math.cos(angle+c.d)+1+c.r/2)/2;
        c.x += Math.sin(angle);
        if(c.y>canvas.height) c.y = 0;
      });
      angle+=0.01;
    }
    const interval = setInterval(draw,30);
    setTimeout(()=>{
      clearInterval(interval);
      canvas.remove();
    },2000);
  }

  // Dernière page
  const message = "J’espère que ce petit voyage t’a plu ! 😄\nMerci d’avoir pris le temps de découvrir mes poèmes et ma musique.\nÀ bientôt pour de nouvelles surprises !";
  const finalText = document.getElementById("finalText");
  let i = 0;

  function typeWriter() {
    if(i < message.length){
      finalText.innerHTML += message.charAt(i) === "\n" ? "<br>" : message.charAt(i);
      i++;
      setTimeout(typeWriter, 50);
    }
  }

  function showFinalPage() {
    document.getElementById("poemBox").classList.add("hidden");
    const finalPage = document.getElementById("finalPage");
    finalPage.classList.remove("hidden");
    typeWriter();
  }
</script>

</body>
</html>
